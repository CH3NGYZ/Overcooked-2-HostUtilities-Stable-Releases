name: Sync Release to Gitee

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-release:
    name: Sync Current Release to Gitee
    runs-on: windows-latest

    steps:
      # 1. 只下载当前 GitHub Release 的附件
      - name: Download Current Release Assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"

          $AssetDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $AssetDir -Force | Out-Null

          gh release download "$env:RELEASE_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --dir "$AssetDir" `
            --skip-existing

          $Assets = @(Get-ChildItem -Path $AssetDir -File)

          Write-Host "当前版本：$env:RELEASE_TAG"
          Write-Host "附件数量：$($Assets.Count)"

          $Assets | ForEach-Object {
            Write-Host "附件：$($_.Name)"
          }

      # 2. 尝试删除 Gitee 上相同 Tag 的旧 Release
      #    即使删除失败，也继续执行后续步骤
      - name: Delete Existing Gitee Release
        id: delete_release
        continue-on-error: true
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: delete_release
          gitee_owner: ${{ github.repository_owner }}
          gitee_repo: ${{ github.event.repository.name }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.event.release.tag_name }}

      # 3. 创建当前版本并上传附件
      #    每个附件最多重试 3 次
      - name: Create Gitee Release and Upload Assets
        id: create_release
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: ${{ github.repository_owner }}
          gitee_repo: ${{ github.event.repository.name }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}

          gitee_tag_name: ${{ github.event.release.tag_name }}
          gitee_release_name: ${{ github.event.release.name || github.event.release.tag_name }}
          gitee_release_body: ${{ github.event.release.body }}
          gitee_target_commitish: ${{ github.event.release.target_commitish || 'main' }}

          gitee_upload_retry_times: 3
          gitee_files: |
            release-assets/*
