name: Sync Release to Gitee

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-release:
    name: Sync Current Release to Gitee
    runs-on: windows-latest

    steps:
      - name: Download Current Release Assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"

          $AssetDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $AssetDir -Force | Out-Null

          gh release download "$env:RELEASE_TAG" `
            --repo "$env:GITHUB_REPOSITORY" `
            --dir "$AssetDir"

          $Assets = @(Get-ChildItem -Path $AssetDir -File)

          if ($Assets.Count -eq 0) {
            Write-Host "当前 Release 没有附件，仅创建 Gitee Release。"
          } else {
            Write-Host "当前 Release 附件："
            $Assets | ForEach-Object {
              Write-Host " - $($_.Name)"
            }
          }

      - name: Create Gitee Release
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: create_release

          gitee_owner: ${{ github.repository_owner }}
          gitee_repo: ${{ github.event.repository.name }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}

          gitee_tag_name: ${{ github.event.release.tag_name }}
          gitee_release_name: ${{ github.event.release.name || github.event.release.tag_name }}
          gitee_release_body: ${{ github.event.release.body }}
          gitee_target_commitish: ${{ github.event.release.target_commitish || 'main' }}

          gitee_upload_retry_times: 3
          gitee_files: |
            release-assets/*
